# Bus board: the reworked map (assets/map/bus_map_reworked_v2.pdf).
# Digitized in Phase 0 from the map image (circle/street detection + OCR of site letters),
# then checked by eye against the overlay in docs/board-check.png.
#
# Coordinates are map pixels in a 1991 x 1991 frame (the PDF page rendered at 100 dpi);
# the UI scales them. Node ids run in reading order (top to bottom, left to right).
#
# nodes:   intersections. station = train station (Passengers action puts passengers here);
#          roundabout = Central Park roundabout (one starting passenger each).
# streets: undirected edges between two nodes; `via` lists bend points for drawing only.
# sites:   construction sites. tier A-D replaces the rulebook's numbered tiers: all A sites must
#          be filled before any B, and so on (setup fills A). `node` is the intersection the
#          building belongs to (passengers enter and leave it there).
# Counts: 36 nodes, 70 streets, 47 sites (A 12, B 11, C 9, D 15). tests/data/test_board.py checks them.

